# Stage-1 PROPER — ColTurk-VDR (raw Qwen3-VL-4B, LR=5e-5 winner)
#
# Validation run (LR sweep + 100-step val) DOĞRULANDI 2026-06-01:
#   - S47 LR=5e-5 kazanan; F28 reusable checkpoint (NDCG@10 smoke 0.4743→0.5252, hâlâ tırmanıyor)
#   - eval pipeline + curve + HF persistence GPU'da çalışıyor
#
# Bu config GERÇEK Stage-1: ~1 epoch'a doğru (manu/colpali 108K query / batch 32 ≈ 3385 step),
# multi-session resume (launcher --resume-from-checkpoint + on_save HF push), curve-eval ile
# plato'da DUR. Schedule full epoch'a yayılı → LR sağlıklı kalır, harcama curve-driven.
#
# Refs (KARARLAR):
#   - S46 — base raw Qwen/Qwen3-VL-4B-Instruct (Apache-2.0, warm-start YOK)
#   - S47 — LR=5e-5 locked (sweep kazananı)
#   - S37 — recipe (LoRA r=32 α=32 dropout=0.1, linear decay, adamw_torch, K=2 @0.95 hard-neg)
#   - F28 — custom_text_proj modules_to_save (reusable checkpoint için zorunlu)
#
# manu/colpali (USE_LOCAL_DATASET=0 → launcher set ediyor): EN+FR ColPali train seti.
# Türkçe veri Stage-2'de (S38 continual). Contamination CLEARED (2026-06-01 doğrulama):
#   18 ay zaman boşluğu (V3 docs 2024-2026 > ColPali Haz-2024) + dil uyuşmazlığı (EN-only train,
#   4 FR subtask temiz) + ILLUIN explicit doc-level dedup.

config:
  (): colpali_engine.trainer.colmodel_training.ColModelTrainingConfig
  output_dir: !path ${OUTPUT_DIR}/colturk-vdr-stage1

  processor:
    (): colpali_engine.utils.transformers_wrappers.AllPurposeWrapper
    class_to_instanciate: !ext colpali_engine.models.ColQwen3Processor
    pretrained_model_name_or_path: "Qwen/Qwen3-VL-4B-Instruct"
    # Hız kaldıracı: 1024 yerine 768 visual token (~%15-25 hız + VRAM; doküman kalite <1-3%).
    # --smoke-step bu kwarg'ı doğrular; ColQwen3Processor.from_pretrained kabul etmezse kaldır.
    max_num_visual_tokens: 768

  model:
    (): colpali_engine.utils.transformers_wrappers.AllPurposeWrapper
    class_to_instanciate: !ext colpali_engine.models.ColQwen3
    pretrained_model_name_or_path: "Qwen/Qwen3-VL-4B-Instruct"
    torch_dtype: !ext torch.bfloat16
    use_cache: false
    # sdpa = GÜVENLİ default (F19: FA2 wheel yoksa crash). Notebook FA2 wheel install BAŞARILIYSA
    # bu satırı flash_attention_2'ye sed'liyor; başarısızsa sdpa kalır. yaml asla FA2'ye bağımlı değil.
    attn_implementation: "sdpa"

  # F17: canonical train_dataset (dataset_loading_func YOK; load_train_set_ir_negs YOK).
  # num_negs=2 → Nemotron K=2 hard-neg (S37). load_train_set_ir manu/colpali yükler (USE_LOCAL_DATASET=0).
  train_dataset:
    (): colpali_engine.utils.dataset_transformation.load_train_set_ir
    num_negs: 2

  # F11/F13: eval_dataset_loader YOK (vidore_v3_eval.yaml mevcut değil); eval ColModelTraining
  # dışında eval_colturk_checkpoint.py curve harness ile yapılır (run_eval=false).
  run_train: true
  run_eval: false

  loss_func:
    (): colpali_engine.loss.late_interaction_losses.ColbertPairwiseNegativeCELoss

  tr_args:
    (): transformers.training_args.TrainingArguments
    output_dir: !path ${OUTPUT_DIR}/colturk-vdr-stage1
    # F22: overwrite_output_dir transformers v5'te REMOVED.
    num_train_epochs: 1                      # ~3385 step TAVAN; curve-eval plato'da DUR (taahhüt değil)
    per_device_train_batch_size: 2           # validation'da 75GB'de kanıtlı
    gradient_accumulation_steps: 16          # effective batch 32 (S37)
    learning_rate: 5.0e-5                    # S47 kazanan
    lr_scheduler_type: "linear"              # S37 (cosine değil)
    warmup_steps: 10                         # F27: warmup_ratio v5-deprecated → sabit step
    bf16: true
    optim: "adamw_torch"                     # S37 (paged_adamw_8bit DEĞİL — maintainer)
    save_strategy: "steps"
    save_steps: 250                          # curve checkpoint'leri + resume noktaları
    save_total_limit: 3                      # local disk bounded; her checkpoint on_save ile HF'e push'lanır (hepsi HF'te kalır)
    eval_strategy: "no"                      # run_eval=false ile uyum
    logging_steps: 10
    report_to: "wandb"                       # launcher F25: key geçersizse graceful disable
    run_name: "colturk-vdr-stage1"
    dataloader_num_workers: 8
    gradient_checkpointing: true
    seed: 42

  peft_config:
    (): peft.LoraConfig
    r: 32
    lora_alpha: 32
    lora_dropout: 0.1
    init_lora_weights: "gaussian"
    bias: "none"
    task_type: "FEATURE_EXTRACTION"
    # F28: custom_text_proj target_modules'tan ÇIKARILDI (LoRA+modules_to_save çakışması),
    # modules_to_save ile FULL train+save → reusable checkpoint (validation'da kanıtlandı).
    target_modules: '(.*(language_model).*(down_proj|gate_proj|up_proj|k_proj|q_proj|v_proj|o_proj).*$)'
    modules_to_save: ["custom_text_proj"]

# Çalıştırma (notebook Cell 5 — resume-aware):
#   python scripts/training/launch_stage1_sweep.py \
#     configs/qwen3/train_colturk_stage1.yaml \
#     --push-to-hub Verm1ion/ColTurk-VDR-Stage1 \
#     [--resume-from-checkpoint /content/outputs/colturk-vdr-stage1/checkpoint-N]
#
# Pre-flight (gerçek run öncesi, saniyeler):
#   python scripts/training/launch_stage1_sweep.py configs/qwen3/train_colturk_stage1.yaml --smoke-step
