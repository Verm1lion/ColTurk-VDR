# Phase D (Orta tier) — ColTurk-VDR diverse 2nd run for MODEL SOUP.
#
# Why: model-soup gains are real only with DIVERSE runs (different seed/LR/data order). Our
# same-run checkpoints don't help (ckpt-1500 < ckpt-1000 proved it). This config trains a 2nd
# run that differs from run A ONLY by seed (42 -> 1234) -> different LoRA gaussian init + different
# data shuffle order -> a genuinely different trajectory of comparable quality. Then soup run-A best
# (ckpt-1000, 0.5584) with this run's best checkpoint via scripts/training/soup_lora_adapters.py
# (full-model weighted-avg, LoRA + custom_text_proj both exact). Verified gain: +0.4-1.0.
#
# Single-variable diversity (seed only) keeps run B as strong as run A (LR/recipe unchanged = the
# proven 0.5584 recipe). If Phase C shows num_negs=4 wins, re-make this with num_negs=4 to soup
# the stronger recipe's diverse runs. Curve-gated: stop run B at ITS peak (expect ~1000, like run A).
#
# Diff vs train_colturk_stage1.yaml: seed 42->1234, output_dir/run_name suffix. Deploy: needs to
# reach Colab (fresh GitHub push OR manual upload — current PAT is dead).

config:
  (): colpali_engine.trainer.colmodel_training.ColModelTrainingConfig
  output_dir: !path ${OUTPUT_DIR}/colturk-vdr-stage1-seed1234

  processor:
    (): colpali_engine.utils.transformers_wrappers.AllPurposeWrapper
    class_to_instanciate: !ext colpali_engine.models.ColQwen3Processor
    pretrained_model_name_or_path: "Qwen/Qwen3-VL-4B-Instruct"
    max_num_visual_tokens: 768

  model:
    (): colpali_engine.utils.transformers_wrappers.AllPurposeWrapper
    class_to_instanciate: !ext colpali_engine.models.ColQwen3
    pretrained_model_name_or_path: "Qwen/Qwen3-VL-4B-Instruct"
    torch_dtype: !ext torch.bfloat16
    use_cache: false
    attn_implementation: "sdpa"

  train_dataset:
    (): colpali_engine.utils.dataset_transformation.load_train_set_ir
    num_negs: 2

  run_train: true
  run_eval: false

  loss_func:
    (): colpali_engine.loss.late_interaction_losses.ColbertPairwiseNegativeCELoss

  tr_args:
    (): transformers.training_args.TrainingArguments
    output_dir: !path ${OUTPUT_DIR}/colturk-vdr-stage1-seed1234
    num_train_epochs: 1
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 16
    learning_rate: 5.0e-5
    lr_scheduler_type: "linear"
    warmup_steps: 10
    bf16: true
    optim: "adamw_torch"
    save_strategy: "steps"
    save_steps: 50                           # ~40dk/checkpoint (intermittent-friendly: ani durmada <=40dk kayip). Her checkpoint HF'e push -> resume safe.
    save_total_limit: 3
    eval_strategy: "no"
    logging_steps: 10
    report_to: "wandb"
    run_name: "colturk-vdr-stage1-seed1234"
    dataloader_num_workers: 8
    gradient_checkpointing: true
    seed: 1234                               # PHASE D DIVERSITY: tek degisken (run A seed=42)

  peft_config:
    (): peft.LoraConfig
    r: 32
    lora_alpha: 32
    lora_dropout: 0.1
    init_lora_weights: "gaussian"
    bias: "none"
    task_type: "FEATURE_EXTRACTION"
    target_modules: '(.*(language_model).*(down_proj|gate_proj|up_proj|k_proj|q_proj|v_proj|o_proj).*$)'
    modules_to_save: ["custom_text_proj"]

# Çalıştırma (fresh, ayrı repo):
#   python scripts/training/launch_stage1_sweep.py \
#     configs/qwen3/train_colturk_stage1_diverse.yaml \
#     --push-to-hub Verm1ion/ColTurk-VDR-Stage1-seed1234
# Sonra soup:
#   python scripts/training/soup_lora_adapters.py \
#     --adapters Verm1ion/ColTurk-VDR-Stage1:checkpoint-1000 Verm1ion/ColTurk-VDR-Stage1-seed1234:checkpoint-<BEST> \
#     --output /content/ckpts/soup_AB --push-to-hub Verm1ion/ColTurk-VDR-soup
#   python scripts/eval/eval_colturk_checkpoint.py --adapter /content/ckpts/soup_AB --bootstrap 1000 --output eval/results/soup_AB.json
