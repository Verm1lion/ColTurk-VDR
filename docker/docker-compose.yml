# ColTurk-VDR full stack — local dev / demo
# Placeholder — finalized in Day 12 (Productization phase).
# Services:
#   - retriever-api  (FastAPI + ColTurk-VDR LoRA, port 8000)
#   - vector-db      (Qdrant multi-vector, port 6333)
#   - reader         (vLLM Qwen3-VL-8B reranker/RAG reader, port 8001) — optional, heavy
#   - dashboard      (Streamlit demo UI, port 8501)
#   - redis          (Celery broker for batch retrieval, port 6379)
#   - prometheus     (metrics, port 9090)
#   - grafana        (dashboards, port 3000)

services:
  retriever-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: colturk-retriever-api
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - QDRANT_URL=http://vector-db:6333
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ../models:/app/models:ro
    depends_on:
      - vector-db
    restart: unless-stopped

  vector-db:
    image: qdrant/qdrant:v1.12.0
    container_name: colturk-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: colturk-dashboard
    ports:
      - "8501:8501"
    environment:
      - RETRIEVER_API_URL=http://retriever-api:8000
    depends_on:
      - retriever-api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: colturk-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Optional heavy services (uncomment for full stack)
